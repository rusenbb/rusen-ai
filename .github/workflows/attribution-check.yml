name: Attribution check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits and PR body
        env:
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -eu
          msg_pattern='co-authored-by:.*(claude|anthropic)|claude-session:|generated (with|by) \[?claude code|claude\.ai/code'
          ident_pattern='^claude <|anthropic\.com'
          fail=0

          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -q '^0*$' && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER~1..$PUSH_AFTER"
          fi

          for c in $(git rev-list "$range"); do
            idents="$(git log -1 --format='%an <%ae>%n%cn <%ce>' "$c")"
            if printf '%s\n' "$idents" | grep -q -i -E "$ident_pattern"; then
              echo "::error::Commit $c has an AI author or committer: $(printf '%s' "$idents" | tr '\n' ' ')"
              fail=1
            fi
            if git log -1 --format=%B "$c" | grep -q -i -E "$msg_pattern"; then
              echo "::error::Commit $c message contains AI attribution"
              fail=1
            fi
          done

          if [ "$EVENT" = "pull_request" ] && printf '%s' "$PR_BODY" | grep -q -i -E "$msg_pattern|claude-projects-attribution"; then
            echo "::error::PR description contains AI attribution"
            fail=1
          fi

          exit $fail
